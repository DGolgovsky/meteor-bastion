name: Verify Meteor Bastion

on:
  push:
    branches: [master, visual-density-screenshots-20261108]
  pull_request:

jobs:
  smoke-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests (no npm dependencies)
        run: node tests/smoke.cjs
      - name: Seeded campaigns and three-attempt balance guard
        run: node tests/balance.cjs --check-balance
      - name: Bounded laser workload
        run: node tests/laser-perf.cjs
      - name: Build single-file game
        run: python3 build.py
      - name: Verify assembled game exists
        run: test -s index.html
